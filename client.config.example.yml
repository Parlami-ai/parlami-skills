# ============================================================
# Parlami.ai — Client Configuration Template
# ============================================================
# Copy this file to clients/<client_slug>.config.yml
# Fill in all values. Never commit real API keys to git.
# ============================================================

client:
  slug: "school-name-slug"          # e.g. "beibei-amigos" (used for filenames)
  business_type: "preschool"        # preschool | daycare | montessori | k12 | tutoring

# ─── School 1 ─────────────────────────────────────────────
school1:
  name: "{{SCHOOL1_NAME}}"                    # e.g. "Sunshine Bilingual Academy"
  name_slug: "{{SCHOOL1_NAME_SLUG}}"          # e.g. "sunshine-bilingual"
  address: "{{SCHOOL1_ADDRESS}}"              # Full street address
  neighborhood: "{{SCHOOL1_NEIGHBORHOOD}}"   # e.g. "North Scottsdale"
  city: "{{SCHOOL1_CITY}}"
  state: "{{SCHOOL1_STATE}}"
  zip: "{{SCHOOL1_PRIMARY_ZIP}}"
  phone: "{{SCHOOL1_PHONE}}"
  website: "{{SCHOOL1_WEBSITE}}"             # e.g. "sunshineacademy.com"
  tour_page: "{{SCHOOL1_TOUR_PAGE}}"         # e.g. "/tour/" or "/schedule-a-visit/"
  min_age: "{{SCHOOL1_MIN_AGE}}"             # e.g. "6 weeks" or "18 months"
  max_age: "{{SCHOOL1_MAX_AGE}}"             # e.g. "5 years" or "K-2"
  programs: "{{SCHOOL1_PROGRAMS}}"           # e.g. "Mandarin & Spanish immersion"
  differentiator: "{{SCHOOL1_DIFFERENTIATOR}}"  # What makes them unique?
  target_zips: "{{SCHOOL1_TARGET_ZIPS}}"     # Comma-separated zip codes

# ─── School 2 (optional — remove if single-location) ──────
school2:
  name: "{{SCHOOL2_NAME}}"
  name_slug: "{{SCHOOL2_NAME_SLUG}}"
  address: "{{SCHOOL2_ADDRESS}}"
  neighborhood: "{{SCHOOL2_NEIGHBORHOOD}}"
  city: "{{SCHOOL2_CITY}}"
  state: "{{SCHOOL2_STATE}}"
  zip: "{{SCHOOL2_PRIMARY_ZIP}}"
  phone: "{{SCHOOL2_PHONE}}"
  website: "{{SCHOOL2_WEBSITE}}"
  tour_page: "{{SCHOOL2_TOUR_PAGE}}"
  min_age: "{{SCHOOL2_MIN_AGE}}"
  max_age: "{{SCHOOL2_MAX_AGE}}"
  programs: "{{SCHOOL2_PROGRAMS}}"
  differentiator: "{{SCHOOL2_DIFFERENTIATOR}}"
  target_zips: "{{SCHOOL2_TARGET_ZIPS}}"

# ─── Google Ads ────────────────────────────────────────────
google_ads:
  customer_id: "{{GOOGLE_ADS_CUSTOMER_ID}}"  # 10-digit, no dashes
  pmax_campaign_id: "{{PMAX_CAMPAIGN_ID}}"
  asset_groups:
    infant: "{{ASSET_GROUP_INFANT_ID}}"
    toddler: "{{ASSET_GROUP_TODDLER_ID}}"
    preschool: "{{ASSET_GROUP_PRESCHOOL_ID}}"
    k2: "{{ASSET_GROUP_K2_ID}}"             # Remove if not applicable
  target_cpa: 45                             # Target cost per tour booking ($)
  daily_budget: 50                           # Daily ad spend limit ($)

# ─── Google Analytics 4 ───────────────────────────────────
ga4:
  school1_property_id: "{{GA4_PROPERTY_ID_SCHOOL1}}"
  school1_measurement_id: "{{GA4_MEASUREMENT_ID_SCHOOL1}}"
  school2_property_id: "{{GA4_PROPERTY_ID_SCHOOL2}}"    # Optional
  school2_measurement_id: "{{GA4_MEASUREMENT_ID_SCHOOL2}}"

# ─── Google Business Profile ──────────────────────────────
gmb:
  school1_location_id: "{{GMB_LOCATION_ID_SCHOOL1}}"
  school2_location_id: "{{GMB_LOCATION_ID_SCHOOL2}}"   # Optional

# ─── Airtable ─────────────────────────────────────────────
airtable:
  base_id_school1: "{{AIRTABLE_BASE_ID_SCHOOL1}}"
  base_id_school2: "{{AIRTABLE_BASE_ID_SCHOOL2}}"       # Optional
  approval_queue_base: "{{AIRTABLE_APPROVAL_QUEUE_BASE}}"

# ─── WordPress (if applicable) ────────────────────────────
wordpress:
  school1_url: "{{WP_SCHOOL1_URL}}"
  school1_user: "{{WP_SCHOOL1_USER}}"
  school1_app_password: "{{WP_SCHOOL1_APP_PASSWORD}}"
  school1_author_id: "{{WP_SCHOOL1_AUTHOR_ID}}"
  school1_blog_category_id: "{{WP_SCHOOL1_BLOG_CATEGORY_ID}}"

# ─── Social Media ─────────────────────────────────────────
social:
  instagram_handle: "{{INSTAGRAM_HANDLE}}"
  facebook_page_id: "{{FACEBOOK_PAGE_ID}}"
  facebook_ads_account: "{{FACEBOOK_ADS_ACCOUNT_ID}}"

# ─── Email ────────────────────────────────────────────────
email:
  provider: "mailchimp"                      # mailchimp | klaviyo | activecampaign
  list_id: "{{EMAIL_LIST_ID}}"
  from_name: "{{EMAIL_FROM_NAME}}"
  from_email: "{{EMAIL_FROM_ADDRESS}}"

# ─── Assets ───────────────────────────────────────────────
assets:
  school1_google_drive: "{{SCHOOL1_GOOGLE_DRIVE_PHOTOS_URL}}"
  school2_google_drive: "{{SCHOOL2_GOOGLE_DRIVE_PHOTOS_URL}}"
  brand_colors_primary: "{{BRAND_COLOR_PRIMARY}}"       # e.g. "#FF6B35"
  brand_colors_secondary: "{{BRAND_COLOR_SECONDARY}}"
  logo_url: "{{LOGO_URL}}"

# ─── Reporting ────────────────────────────────────────────
reporting:
  weekly_report_day: "Friday"
  weekly_report_time: "17:00"
  timezone: "{{CLIENT_TIMEZONE}}"           # e.g. "America/Phoenix"
  kpi_targets:
    cptb_target: 50                          # Max cost per tour booking
    ctr_target: 3.5                          # Min click-through rate %
    quality_score_target: 7                  # Min QS
    conversion_rate_target: 3.0             # Min landing page CVR %

# ─── API Keys (reference only — use .env for actual keys) ─
# DO NOT put real keys here. Use environment variables.
# Required env vars:
#   GOOGLE_ADS_DEVELOPER_TOKEN
#   GOOGLE_ADS_CLIENT_ID
#   GOOGLE_ADS_CLIENT_SECRET
#   GOOGLE_ADS_REFRESH_TOKEN
#   AIRTABLE_API_TOKEN
#   ANTHROPIC_API_KEY (or OPENAI_API_KEY)
#   ELEVENLABS_API_KEY (optional — for voice)
